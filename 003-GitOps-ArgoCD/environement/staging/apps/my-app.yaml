# Child Argo CD Application: Git path environement/staging/my-app → cluster (foo + nginx).
# YAML document separator.
---
# Argo Application CRD version.
apiVersion: argoproj.io/v1alpha1
# Application resource.
kind: Application
# Metadata: name, namespace, finalizers.
metadata:
  # Application object name in Argo.
  name: my-app-foo
  # Installed alongside other Argo CD resources.
  namespace: argocd
  # Ensure managed resources are deleted when this Application is deleted.
  finalizers:
    # Cascade finalizer for child app.
    - resources-finalizer.argocd.argoproj.io
# Desired state and sync behavior.
spec:
  # AppProject granting repo/destination permissions.
  project: default
  # Git repository configuration.
  source:
    # Clone from this repo.
    repoURL: https://github.com/aminlahbib/Terraform.git
    # Track this branch/tag/commit.
    targetRevision: HEAD
    # Path to Kubernetes manifests in the repo.
    path: 003-GitOps-CD-for-Kubernetes-with-ArgoCD/environement/staging/my-app
  # Where to apply manifests.
  destination:
    # Same cluster that hosts Argo CD.
    server: https://kubernetes.default.svc
  # Continuous GitOps sync.
  syncPolicy:
    # Automation settings.
    automated:
      # Remove resources absent from Git.
      prune: true
      # Correct drift toward Git.
      selfHeal: true
      # Refuse sync that would leave zero resources (when false).
      allowEmpty: false
    # Additional kubectl/Argo sync flags.
    syncOptions:
      # Validate manifests against API server schema.
      - Validate=true
      # Do not auto-create destination namespace.
      - CreateNamespace=false
      # Delete dependents before owners during prune.
      - PrunePropagationPolicy=foreground
      # Run pruning after other sync operations.
      - PruneLast=true
