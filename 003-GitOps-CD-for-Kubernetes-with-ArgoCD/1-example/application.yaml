# Example Argo CD Application: syncs staging `my-app` manifests from this repo to the same cluster.
# Apply: kubectl apply -n argocd -f 1-example/application.yaml
# Deletion: `argocd app delete my-app` or `kubectl delete -f 1-example/application.yaml --timeout=120s`.
# Finalizer must match https://argo-cd.readthedocs.io/en/latest/user-guide/app_deletion/ (foreground cascade).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aminlahbib/Terraform.git
    targetRevision: HEAD
    path: 003-GitOps-CD-for-Kubernetes-with-ArgoCD/environement/staging/my-app
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
