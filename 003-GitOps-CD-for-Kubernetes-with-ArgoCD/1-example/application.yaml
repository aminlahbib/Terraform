# Example Argo CD Application: syncs the `my-app` path in this repo to the same cluster (in-cluster).
# Apply to the cluster where Argo CD runs: `kubectl apply -n argocd -f 1-example/application.yaml`
# Note: `spec.source.path` must be the directory in Git that holds Kubernetes manifests (or Helm/Kustomize roots).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: my-app
    namespace: argocd
    finalizers:
    - resources-finalizer.argocd.argoproj.io/resources
spec:
    project: default 
    source:
        repoURL: 'https://github.com/aminlahbib/Terraform.git'
        targetRevision: HEAD
    path: my-app
    destination:
    server: https://kubernetes.default.svc
    syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true