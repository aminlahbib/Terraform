# Example Argo CD Application: syncs staging `my-app` manifests from this repo to the same cluster.
# Apply: kubectl apply -n argocd -f 1-example/application.yaml
# The resources finalizer makes Argo prune managed objects before the Application CR is removed; if sync is broken
# (bad repo path / branch), deletion can stick until you fix the source or clear finalizers (see project docs / Argo troubleshooting).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/resources
spec:
  project: default
  source:
    repoURL: https://github.com/aminlahbib/Terraform.git
    targetRevision: HEAD
    path: 003-GitOps-CD-for-Kubernetes-with-ArgoCD/environement/staging/my-app
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
