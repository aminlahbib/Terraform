# "App of apps" root Application for staging: syncs every manifest under `.../staging/apps/`
# (child Application CRs). Those children each point at workload directories (e.g. my-app, second-app).
# Ensure `spec.source.path` matches the real folder name in Git (this repo uses `environement/`, not `environments/`).

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/resources
spec:
  project: default
  source:
    repoURL: 'https://github.com/aminlahbib/Terraform.git'
    targetRevision: HEAD
    # Must match a real directory in Git (this repo uses `environement`, not `environments`).
    path: 003-GitOps-CD-for-Kubernetes-with-ArgoCD/environement/staging/apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true