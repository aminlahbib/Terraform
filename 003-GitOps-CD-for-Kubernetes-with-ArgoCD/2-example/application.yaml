# "App of apps" root Application for staging: syncs every manifest under `.../staging/apps/`
# (child Application CRs). Those children each point at workload directories (e.g. my-app, second-app).
# Ensure `spec.source.path` matches the real folder name in Git (this repo uses `environement/`, not `environments/`).
#
# Deletion: Prefer `argocd app delete apps-staging` (cascade). Plain `kubectl delete` waits on the finalizer; if the
# app stays "Deleting", see https://argo-cd.readthedocs.io/en/latest/user-guide/app_deletion/ — use the documented
# finalizer name below. Increase wait: `kubectl delete -f 2-example/application.yaml --timeout=120s`.

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-staging
  namespace: argocd
  finalizers:
    # Foreground cascade (official). Avoid `.../resources` — it can deadlock with automated sync during delete.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/aminlahbib/Terraform.git'
    targetRevision: HEAD
    path: 003-GitOps-CD-for-Kubernetes-with-ArgoCD/environement/staging/apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true