# Sample workload: nginx Deployment in namespace `foo`. The GitOps demo script (`updrade.sh`) rewrites
# the `aminlahbib/nginx:<tag>` image to roll out new versions via Git commits.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: foo
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: aminlahbib/nginx:v0.1.2
          ports:
          - containerPort: 80