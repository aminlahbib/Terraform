# Helm values overlay for argo-cd: image tag and server flags (merged with chart defaults).
# Start of YAML document.
---
# Chart-wide defaults shared by all Argo CD components.
global:
  # Container image settings.
  image:
    # Argo CD image tag (pins server/controller/etc. version).
    tag: v2.6.6

# Argo CD API/UI server settings.
server:
  # Extra CLI args passed to argocd-server.
  extraArgs:
    # Serve HTTP without TLS on the pod (common behind ingress or port-forward).
    - --insecure
