---
metrics:
  enabled: true

config:
  argocd.serverAddress: "argocd-server.argocd"
  argocd.insecure: "true"
  argocd.grpcWeb: "true"
  argocd.plaintext: "true"

  registries:
    - name: Docker Hub
      api_url: https://registry-1.docker.io
      ping: yes
      credentials: secret:argocd/dockerhub#my-token
      limit: 20
      default: true